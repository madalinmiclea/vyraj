name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run data
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_EVE_CLIENT_ID: ${{ vars.EVE_CLIENT_ID }}
          VITE_EVE_CALLBACK_URL: ${{ vars.EVE_CALLBACK_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
