name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * 3'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run data

      - run: npm run build
        env:
          VITE_EVE_CLIENT_ID: ${{ vars.EVE_CLIENT_ID }}
          VITE_EVE_CALLBACK_URL: ${{ vars.EVE_CALLBACK_URL }}

      - name: Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'vyraj' }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main
